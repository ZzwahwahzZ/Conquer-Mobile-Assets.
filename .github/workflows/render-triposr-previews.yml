name: Render TripoSR GLB previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/triposr_42/*.glb"
      - ".github/workflows/render-triposr-previews.yml"

permissions:
  contents: write

concurrency:
  group: render-triposr-previews
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout assets
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install trimesh numpy matplotlib pillow

      - name: Render each GLB and build geometry audit
        run: |
          mkdir -p previews/triposr_42
          python - <<'PY'
          from pathlib import Path
          import csv, json, traceback
          import numpy as np
          import trimesh
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          from mpl_toolkits.mplot3d.art3d import Poly3DCollection
          from PIL import Image, ImageOps, ImageDraw

          src = Path("assets/triposr_42")
          out = Path("previews/triposr_42")
          out.mkdir(parents=True, exist_ok=True)
          rows, thumbs = [], []

          for path in sorted(src.glob("*.glb")):
              row = {"file": path.name, "status": "ERROR", "vertices": 0, "faces": 0,
                     "components": 0, "watertight": False, "degenerate_faces": None,
                     "extent_x": None, "extent_y": None, "extent_z": None, "error": ""}
              try:
                  loaded = trimesh.load(path, force="scene", process=False)
                  meshes = [g for g in loaded.geometry.values() if isinstance(g, trimesh.Trimesh)] if isinstance(loaded, trimesh.Scene) else [loaded]
                  meshes = [m for m in meshes if len(m.vertices) and len(m.faces)]
                  if not meshes:
                      raise ValueError("No triangle mesh geometry found")
                  mesh = trimesh.util.concatenate(meshes)
                  bounds = mesh.bounds
                  ext = mesh.extents
                  row.update(status="RENDERED", vertices=int(len(mesh.vertices)), faces=int(len(mesh.faces)),
                             components=int(len(mesh.split(only_watertight=False))),
                             watertight=bool(mesh.is_watertight),
                             degenerate_faces=int(np.count_nonzero(mesh.area_faces <= 1e-12)),
                             extent_x=float(ext[0]), extent_y=float(ext[1]), extent_z=float(ext[2]))
                  # Center and normalize while preserving proportions.
                  v = mesh.vertices - mesh.bounding_box.centroid
                  scale = max(float(np.max(np.ptp(v, axis=0))), 1e-9)
                  v = v / scale
                  f = mesh.faces
                  if len(f) > 18000:
                      f = f[np.linspace(0, len(f)-1, 18000, dtype=int)]
                  fig = plt.figure(figsize=(5, 5), dpi=120)
                  ax = fig.add_subplot(111, projection="3d")
                  poly = Poly3DCollection(v[f], linewidths=0.015, alpha=1.0)
                  ax.add_collection3d(poly)
                  ax.set_xlim(-0.58, 0.58); ax.set_ylim(-0.58, 0.58); ax.set_zlim(-0.58, 0.58)
                  ax.set_box_aspect((1, 1, 1))
                  ax.view_init(elev=18, azim=-58)
                  ax.set_axis_off()
                  fig.subplots_adjust(0, 0, 1, 1)
                  png = out / (path.stem + ".png")
                  fig.savefig(png, dpi=120, bbox_inches="tight", pad_inches=0.02)
                  plt.close(fig)
                  im = Image.open(png).convert("RGB")
                  im.thumbnail((220, 220))
                  tile = Image.new("RGB", (250, 270), "white")
                  tile.paste(im, ((250-im.width)//2, 4))
                  draw = ImageDraw.Draw(tile)
                  draw.text((8, 232), path.stem[:34], fill="black")
                  draw.text((8, 249), f"V:{row['vertices']} F:{row['faces']}", fill="black")
                  thumbs.append(tile)
              except Exception as e:
                  row["error"] = str(e)[:500]
              rows.append(row)

          with open(out / "geometry_audit.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
              w.writeheader(); w.writerows(rows)

          cols = 6
          cell_w, cell_h = 250, 270
          sheet_rows = max(1, (len(thumbs)+cols-1)//cols)
          sheet = Image.new("RGB", (cols*cell_w, sheet_rows*cell_h), "#dddddd")
          for i, im in enumerate(thumbs):
              sheet.paste(im, ((i%cols)*cell_w, (i//cols)*cell_h))
          if not thumbs:
              ImageDraw.Draw(sheet).text((20, 20), "No previews rendered; inspect geometry_audit.csv", fill="black")
          sheet.save(out / "contact_sheet.jpg", quality=92)

          summary = {
              "expected_glb": 42, "found_glb": len(rows),
              "rendered": sum(r["status"] == "RENDERED" for r in rows),
              "errors": [r for r in rows if r["status"] != "RENDERED"],
              "contact_sheet": "contact_sheet.jpg"
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print(json.dumps(summary, indent=2))
          if len(rows) != 42:
              raise SystemExit(f"Expected 42 GLB files, found {len(rows)}")
          if summary["rendered"] == 0:
              print("WARNING: No GLB previews rendered; CSV contains per-file error details.")
          PY

      - name: Commit previews and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/triposr_42
          if git diff --cached --quiet; then
            echo "No preview changes."
          else
            git commit -m "Add visual previews and geometry audit for 42 TripoSR models"
            git push
          fi
