name: Build Conquer reference catalogue
on:
  workflow_dispatch:
  push:
    paths:
      - "reference_library/**"
      - ".github/workflows/build-reference-catalogue.yml"
permissions:
  contents: write
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python reference_library/scripts/build_catalogue.py
      - name: Commit generated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference_library/catalog
          if ! git diff --cached --quiet; then
            git commit -m "Build community Conquer reference catalogue"
            git push
          fi
