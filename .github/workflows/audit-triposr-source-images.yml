name: Audit TripoSR Source Images

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-triposr-source-images.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install image audit tools
        run: python -m pip install --upgrade pillow numpy

      - name: Download original source archive
        run: |
          python - <<'PY'
          import urllib.request, os
          url = "https://huggingface.co/datasets/ZzwahwahzZ/clash-of-legends-assets/resolve/main/Conquer_TripoSR_42_Models%20(1).zip"
          urllib.request.urlretrieve(url, "/tmp/source_archive.zip")
          print("Downloaded bytes:", os.path.getsize("/tmp/source_archive.zip"))
          PY

      - name: Extract, inventory and audit images
        run: |
          mkdir -p /tmp/source_archive previews/source_images
          python - <<'PY'
          import zipfile, os, csv, json, hashlib, math
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import numpy as np

          archive = "/tmp/source_archive.zip"
          root = Path("/tmp/source_archive")
          with zipfile.ZipFile(archive) as z:
              print("ZIP entries:", len(z.namelist()))
              for n in z.namelist():
                  print("ZIP_ENTRY:", n)
              z.extractall(root)

          all_files = sorted(p for p in root.rglob("*") if p.is_file())
          out = Path("previews/source_images")
          out.mkdir(parents=True, exist_ok=True)
          rows, thumbs, hashes = [], [], {}

          for p in all_files:
              try:
                  raw = p.read_bytes()
                  # Detect actual image content, regardless of filename extension.
                  im = Image.open(p)
                  im.load()
                  detected_format = im.format
                  im = ImageOps.exif_transpose(im)
                  w, h = im.size
                  arr = np.asarray(im.convert("RGB"), dtype=np.float32)
                  gray = arr.mean(axis=2)
                  hist = np.histogram(gray, bins=256, range=(0,255))[0].astype(float)
                  prob = hist / max(hist.sum(), 1)
                  nz = prob[prob > 0]
                  entropy = float(-(nz * np.log2(nz)).sum())
                  brightness, contrast = float(gray.mean()), float(gray.std())
                  ex = np.abs(np.diff(gray, axis=1)).mean() if w > 1 else 0
                  ey = np.abs(np.diff(gray, axis=0)).mean() if h > 1 else 0
                  sha = hashlib.sha256(raw).hexdigest()
                  duplicate = hashes.get(sha, "")
                  hashes.setdefault(sha, str(p.relative_to(root)))
                  rows.append({
                    "file": str(p.relative_to(root)), "bytes": len(raw), "width": w, "height": h,
                    "aspect_ratio": round(w/h,4) if h else "", "detected_format": detected_format,
                    "filename_extension": p.suffix.lower(), "mode": im.mode,
                    "has_alpha": "A" in im.getbands(), "sha256": sha,
                    "exact_duplicate_of": duplicate,
                    "grayscale_entropy_bits": round(entropy,3),
                    "mean_brightness_0_255": round(brightness,2),
                    "contrast_stddev": round(contrast,2),
                    "mean_edge_change": round(float((ex+ey)/2),2),
                    "megapixels": round(w*h/1e6,3)
                  })
                  thumb = ImageOps.contain(im.convert("RGB"), (180,150))
                  tile = Image.new("RGB",(230,195),"white")
                  tile.paste(thumb,((230-thumb.width)//2,4+(150-thumb.height)//2))
                  d=ImageDraw.Draw(tile)
                  d.text((5,158),p.name[:34],fill="black")
                  d.text((5,174),f"{w}x{h} | {len(raw)//1024} KB",fill="black")
                  thumbs.append(tile)
              except Exception as e:
                  rows.append({"file":str(p.relative_to(root)),"bytes":p.stat().st_size,"not_decodable_as_image":repr(e)})

          with open(out/"image_quality_audit.csv","w",newline="",encoding="utf-8") as f:
              cols=sorted({k for row in rows for k in row})
              wr=csv.DictWriter(f,fieldnames=cols); wr.writeheader(); wr.writerows(rows)

          cols=4
          sheet=Image.new("RGB",(cols*230,max(195,math.ceil(len(thumbs)/cols)*195)),"#dddddd")
          for i,t in enumerate(thumbs): sheet.paste(t,((i%cols)*230,(i//cols)*195))
          sheet.save(out/"source_images_contact_sheet.jpg",quality=92)

          summary={
            "archive_bytes":os.path.getsize(archive),
            "total_extracted_files":len(all_files),
            "image_files_detected_by_content":sum(1 for r in rows if "width" in r),
            "non_image_files":sum(1 for r in rows if "not_decodable_as_image" in r),
            "read_errors":[r for r in rows if "not_decodable_as_image" in r],
            "exact_duplicate_files":sum(1 for r in rows if r.get("exact_duplicate_of")),
            "note":"This is an inventory and technical image screen. Visual suitability for single-image-to-3D still requires reviewing the actual image contact sheet."
          }
          (out/"summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          (out/"archive_file_manifest.txt").write_text("\n".join(str(p.relative_to(root)) for p in all_files),encoding="utf-8")
          print("AUDIT_SUMMARY:",json.dumps(summary,ensure_ascii=False))
          PY

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/source_images
          git commit -m "Add source archive image audit diagnostics" || echo "No changes"
          git push
