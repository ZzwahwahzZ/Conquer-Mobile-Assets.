name: Assemble original Conquer Mobile image archive

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download, verify, and join all three volumes
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/ZzwahwahzZ/Conquer-Mobile-Assets./main"
          mkdir -p /tmp/conquer-parts
          cd /tmp/conquer-parts

          curl --fail --location --retry 3 "$base/conquer_original_reference_images.7z.t0.001" -o archive.7z.001
          curl --fail --location --retry 3 "$base/conquer_original_reference_images.7z.t0.002" -o archive.7z.002
          curl --fail --location --retry 3 "$base/conquer_original_reference_images.7z.t0.003" -o archive.7z.003

          test "$(stat -c%s archive.7z.001)" -eq 10485760
          test "$(stat -c%s archive.7z.002)" -eq 10485760
          test "$(stat -c%s archive.7z.003)" -eq 10241830

          7z t archive.7z.001
          cat archive.7z.001 archive.7z.002 archive.7z.003 > "$GITHUB_WORKSPACE/conquer_original_reference_images.7z"
          7z t "$GITHUB_WORKSPACE/conquer_original_reference_images.7z"
          7z l "$GITHUB_WORKSPACE/conquer_original_reference_images.7z"

      - name: Commit the verified combined archive to main
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conquer_original_reference_images.7z
          git commit -m "Add verified combined original image archive"
          git push origin HEAD:main
