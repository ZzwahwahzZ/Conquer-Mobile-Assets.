name: Assemble original Conquer Mobile image archive

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install 7-Zip and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full file unzip

      - name: Download, verify, join, and extract the uploaded containers
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/ZzwahwahzZ/Conquer-Mobile-Assets./main"
          mkdir -p /tmp/conquer-parts /tmp/conquer-inner /tmp/conquer-payload /tmp/conquer-images
          cd /tmp/conquer-parts

          curl --fail --location --retry 3 "$base/conquer_original_reference_images.7z.t0.001" -o archive.7z.001
          curl --fail --location --retry 3 "$base/conquer_original_reference_images.7z.t0.002" -o archive.7z.002
          curl --fail --location --retry 3 "$base/conquer_original_reference_images.7z.t0.003" -o archive.7z.003

          test "$(stat -c%s archive.7z.001)" -eq 10485760
          test "$(stat -c%s archive.7z.002)" -eq 10485760
          test "$(stat -c%s archive.7z.003)" -eq 10241830

          7z t archive.7z.001
          cat archive.7z.001 archive.7z.002 archive.7z.003 > "$GITHUB_WORKSPACE/conquer_original_reference_images.7z"
          7z t "$GITHUB_WORKSPACE/conquer_original_reference_images.7z"

          7z x "$GITHUB_WORKSPACE/conquer_original_reference_images.7z" -o/tmp/conquer-inner -y
          inner="/tmp/conquer-inner/conquer_original_reference_images.7z"
          test -s "$inner"
          7z t "$inner"
          7z x "$inner" -o/tmp/conquer-payload -y

          payload="/tmp/conquer-payload/conquer_original_reference_images.zip"
          test -s "$payload"
          file "$payload" | tee "$GITHUB_WORKSPACE/original_payload_filetype.txt"
          unzip -t "$payload"
          unzip -q "$payload" -d /tmp/conquer-images

          image_count=$(find /tmp/conquer-images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) | wc -l)
          test "$image_count" -eq 42
          mkdir -p "$GITHUB_WORKSPACE/original_images"
          cp -a /tmp/conquer-images/conquer_original_reference_images/. "$GITHUB_WORKSPACE/original_images/"
          find "$GITHUB_WORKSPACE/original_images" -type f | sort | sed "s|$GITHUB_WORKSPACE/||" > "$GITHUB_WORKSPACE/original_images_manifest.txt"
          printf 'Verified extracted image count: %s\n' "$image_count" > "$GITHUB_WORKSPACE/original_images_report.txt"
          du -sh "$GITHUB_WORKSPACE/original_images" >> "$GITHUB_WORKSPACE/original_images_report.txt"

      - name: Commit extracted original images and verified archives to main
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add conquer_original_reference_images.7z original_payload_filetype.txt original_images original_images_manifest.txt original_images_report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Extract and publish original Conquer Mobile reference images"
            git push origin HEAD:main
          fi
