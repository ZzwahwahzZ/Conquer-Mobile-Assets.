name: Audit Verified Original Reference Images

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-verified-original-images.yml"
      - "original_images/**"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified original images
        uses: actions/checkout@v4

      - name: Install audit tools
        run: python -m pip install --upgrade pillow numpy

      - name: Audit all 42 verified source images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import numpy as np, csv, json, hashlib, math

          root=Path("original_images")
          out=Path("previews/verified_source_images")
          out.mkdir(parents=True,exist_ok=True)
          files=sorted(p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".png",".jpg",".jpeg",".webp",".bmp",".tif",".tiff"})
          rows=[]; thumbs=[]; seen={}
          for p in files:
              try:
                  raw=p.read_bytes()
                  im=Image.open(p); im.load()
                  fmt=im.format
                  im=ImageOps.exif_transpose(im)
                  w,h=im.size
                  rgb=im.convert("RGB")
                  arr=np.asarray(rgb,dtype=np.float32)
                  gray=arr.mean(axis=2)
                  hist=np.histogram(gray,bins=256,range=(0,255))[0].astype(float)
                  prob=hist/max(hist.sum(),1); nz=prob[prob>0]
                  entropy=float(-(nz*np.log2(nz)).sum())
                  sha=hashlib.sha256(raw).hexdigest()
                  duplicate=seen.get(sha,""); seen.setdefault(sha,str(p))
                  # Border-vs-center contrast is a rough background separation indicator, not semantic segmentation.
                  border=np.concatenate([arr[0,:,:],arr[-1,:,:],arr[:,0,:],arr[:,-1,:]],axis=0)
                  border_std=float(border.std())
                  center=arr[h//4:max(h//4+1,3*h//4),w//4:max(w//4+1,3*w//4)]
                  center_mean=float(center.mean())
                  rows.append({
                    "file":str(p),"bytes":len(raw),"width":w,"height":h,
                    "megapixels":round(w*h/1e6,3),"aspect_ratio":round(w/h,4),
                    "format":fmt,"mode":im.mode,"has_alpha":"A" in im.getbands(),
                    "sha256":sha,"exact_duplicate_of":duplicate,
                    "grayscale_entropy_bits":round(entropy,3),
                    "mean_brightness":round(float(gray.mean()),2),
                    "contrast_stddev":round(float(gray.std()),2),
                    "border_stddev":round(border_std,2),
                    "center_mean_brightness":round(center_mean,2)
                  })
                  thumb=ImageOps.contain(rgb,(210,170))
                  tile=Image.new("RGB",(250,220),"white")
                  tile.paste(thumb,((250-thumb.width)//2,5+(170-thumb.height)//2))
                  d=ImageDraw.Draw(tile)
                  d.text((6,180),p.name[:37],fill="black")
                  d.text((6,198),f"{w}x{h} | {len(raw)//1024} KB",fill="black")
                  thumbs.append(tile)
              except Exception as e:
                  rows.append({"file":str(p),"error":repr(e)})

          with open(out/"image_quality_audit.csv","w",newline="",encoding="utf-8") as f:
              cols=sorted({k for r in rows for k in r})
              wr=csv.DictWriter(f,fieldnames=cols); wr.writeheader(); wr.writerows(rows)
          cols=4
          sheet=Image.new("RGB",(cols*250,max(220,math.ceil(len(thumbs)/cols)*220)),"#dddddd")
          for i,t in enumerate(thumbs): sheet.paste(t,((i%cols)*250,(i//cols)*220))
          sheet.save(out/"contact_sheet.jpg",quality=94)
          summary={
            "source":"original_images directory, populated by verified 7z.001/.002/.003 -> nested 7z -> ZIP extraction workflow",
            "image_files_found":len(files),
            "images_successfully_decoded":sum(1 for r in rows if "width" in r),
            "decode_errors":[r for r in rows if "error" in r],
            "exact_duplicate_files":sum(1 for r in rows if r.get("exact_duplicate_of")),
            "categories":{k:sum(1 for p in files if p.parent.name==k) for k in sorted(set(p.parent.name for p in files))},
            "important_limit":"Resolution, entropy and contrast are technical screening metrics. Final suitability for single-image-to-3D depends on visual subject isolation, full-body visibility, viewpoint, occlusion and semantic category."
          }
          (out/"summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if len(files)!=42 or summary["images_successfully_decoded"]!=42:
              raise SystemExit("Expected exactly 42 readable original source images")
          PY

      - name: Commit source image audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/verified_source_images
          git commit -m "Audit verified original reference images" || echo "No changes"
          git push
